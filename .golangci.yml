run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
  disable:
    - depguard
    - exhaustruct
    - varnamelen
    - wsl

linters-settings:
  errcheck:
    check-type-assertions: false
  gosec:
    excludes:
      - G104 # Duplicates errcheck
      - G304 # File path from variable (expected in this codebase)

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
