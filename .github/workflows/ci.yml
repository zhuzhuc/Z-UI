name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go vet
        run: cd backend && go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json
      - name: Install frontend deps
        run: cd front && npm ci
      - name: Frontend build check
        run: cd front && npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go tests
        run: cd backend && go test -v ./...

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json
      - name: Build frontend
        run: cd front && npm ci && npm run build
      - name: Build backend
        run: cd backend && CGO_ENABLED=0 go build -ldflags="-s -w" -o z-ui .
      - name: Verify build
        run: |
          ls -la front/dist/
          ls -la backend/z-ui
          ./backend/z-ui --help 2>/dev/null || true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json
      - name: Build frontend
        run: cd front && npm ci && npm run build
      - name: Build backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF_NAME}
          cd backend && go build -ldflags="-s -w -X main.version=${VERSION}" -o ../z-ui .
      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME}
          ARCH=${{ matrix.goos }}-${{ matrix.goarch }}
          mkdir -p z-ui-${VERSION}-${ARCH}/{backend,front/dist,ops}
          cp backend/z-ui z-ui-${VERSION}-${ARCH}/backend/
          cp -r front/dist/* z-ui-${VERSION}-${ARCH}/front/dist/
          cp ops/*.service ops/*.conf ops/*.example z-ui-${VERSION}-${ARCH}/ops/ 2>/dev/null || true
          tar czf z-ui-${VERSION}-${ARCH}.tar.gz z-ui-${VERSION}-${ARCH}/
          sha256sum z-ui-${VERSION}-${ARCH}.tar.gz > z-ui-${VERSION}-${ARCH}.tar.gz.sha256
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            z-ui-*.tar.gz
            z-ui-*.tar.gz.sha256
