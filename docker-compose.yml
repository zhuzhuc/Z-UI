services:
  z-ui:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    ports:
      - "${PORT:-8081}:8081"
    volumes:
      - ./data:/opt/z-ui/data
      - ./runtime:/opt/z-ui/runtime
    environment:
      - GIN_MODE=release
      - PORT=8081
      - ZUI_DB=/opt/z-ui/data/zui.db
      - ZUI_SECRET_FILE=/opt/z-ui/data/.panel_secret
      - PANEL_SECRET=${PANEL_SECRET:-}
      - PANEL_USERNAME=${PANEL_USERNAME:-admin}
      - PANEL_PASSWORD=${PANEL_PASSWORD:-}
      - PANEL_PUBLIC_BASE=${PANEL_PUBLIC_BASE:-}
      - ZUI_STRICT_PRODUCTION=${ZUI_STRICT_PRODUCTION:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
